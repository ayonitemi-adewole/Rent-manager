<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>RentPadi</title>
    <meta name="description" content="RentPadi: rent reminders, payments and records for Nigerian landlords." />

    <!-- Icons (generated by scripts/generate-brand-assets.ts) -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0F5132" />

    <!-- Link previews: tenants and landlords share RentPadi links on WhatsApp. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RentPadi" />
    <meta property="og:title" content="RentPadi" />
    <meta property="og:description" content="Rent reminders, payments and receipts for Nigerian landlords." />
    <meta property="og:image" content="%APP_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="RentPadi logo: an open palm receiving a naira coin" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking the page: text shows in the phone's own font first.
         The logo's font is cut down to the letters of "RentPadi", so it's a few kilobytes. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&text=RentPadi&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&text=RentPadi&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <!-- Shown before the app's files arrive; React replaces #root's contents. -->
    <style>
      html { background: oklch(0.985 0.003 150); color-scheme: light dark; }
      .boot { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 20px; }
      .boot-logo { width: 56px; height: 56px; display: block; }
      .boot-spin { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #0f513233;
        border-top-color: #0f5132; animation: boot-spin 0.8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        html { background: oklch(0.17 0.01 155); }
        .boot-spin { border-color: #8cc5a533; border-top-color: #8cc5a5; }
      }
      @media (prefers-reduced-motion: reduce) { .boot-spin { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading RentPadi">
        <img class="boot-logo" src="/icon.svg" alt="" width="56" height="56" />
        <div class="boot-spin"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
